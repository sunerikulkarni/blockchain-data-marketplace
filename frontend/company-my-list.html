<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataChain — Company My List</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="company-pages.css">
</head>
<body class="company-list-page">
  <div class="site-wrap">
    <header class="app-header">
      <div class="logo">Data<em>Chain</em></div>
      <div class="hdr-title">My List</div>
      <div class="hdr-spacer"></div>
      <div class="live-badge"><div class="live-dot"></div>Sepolia · Testnet</div>
      <div class="company-header-wallet" aria-live="polite"><div class="w-dot"></div><span class="company-wallet-label">Not connected</span><strong class="company-wallet-state">Not linked</strong></div>
      <a class="btn btn-outline btn-sm" href="profile.html">Profile</a>
      <button class="btn btn-secondary btn-sm" type="button" data-wallet-connect data-wallet-label="Connect MetaMask">Connect MetaMask</button>
    </header>
    <main class="main-content">
      <div class="content-inner">
        <div class="company-wallet-notice" role="status"></div>
        <section class="page-banner">
          <div class="banner-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div>
          <div class="banner-text"><h1>My List</h1><p>Datasets purchased by your verified company wallet.</p></div>
        </section>
        <div class="filter-bar"><span id="company-list-count" aria-live="polite">Loading datasets…</span><a class="btn btn-secondary btn-sm" href="marketplace.html">Browse Marketplace</a></div>
        <div id="company-list" class="listings-list" aria-live="polite"><div class="user-home-loading">Loading your datasets…</div></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
  <script src="company-my-list.js"></script>
</body>
</html>
