<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DataChain — My Listings</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* ── LISTINGS-SPECIFIC ── */
    .page-banner {
      background: var(--g-hero);
      border: 1px solid var(--border-card);
      border-radius: var(--r-2xl);
      padding: 22px 20px;
      margin-bottom: 22px;
      display: flex; align-items: center; gap: 16px;
      position: relative; overflow: hidden;
    }
    .page-banner::after {
      content: ''; position: absolute; right: -30px; bottom: -30px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(130,196,138,.26) 0%, transparent 65%);
      border-radius: 50%; pointer-events: none;
    }
    .banner-icon {
      width: 52px; height: 52px; border-radius: var(--r-xl);
      background: var(--g-btn); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--sh-btn); color: #fff;
    }
    .banner-icon svg { width: 24px; height: 24px; }
    .banner-text h2 { font-family: var(--font-d); font-size: 1.1rem; font-weight: 600; margin-bottom: 3px; }
    .banner-text p  { font-size: .8rem; color: var(--text-2); line-height: 1.55; }

    /* Filter bar */
    .filter-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
    .filter-bar .chip-scroll { flex: 1; min-width: 0; }

    /* Listing card — slightly richer than marketplace */
    .listing-card { position: relative; }
    .listing-card .status-dot {
      position: absolute; top: 18px; right: 18px;
      width: 8px; height: 8px; border-radius: 50%;
    }
    .status-dot.active   { background: #4CAF50; box-shadow: 0 0 0 3px rgba(76,175,80,.2); }
    .status-dot.inactive { background: var(--text-3); }

    .listing-meta-row {
      display: flex; align-items: center; gap: 10px;
      padding-top: 12px; border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .listing-meta-item {
      display: flex; align-items: center; gap: 5px;
      font-size: .72rem; font-weight: 600; color: var(--text-3);
    }
    .listing-meta-item svg { width: 13px; height: 13px; }

    .listing-actions { display: flex; gap: 8px; margin-left: auto; }

    /* Earn summary card */
    .earn-card {
      background: linear-gradient(135deg, var(--accent-sub) 0%, rgba(255,255,255,.5) 100%);
      border: 1px solid var(--accent-pale);
      border-radius: var(--r-2xl); padding: 20px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 22px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .earn-left h3 { font-family: var(--font-d); font-size: 1.5rem; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 4px; }
    .earn-left p  { font-size: .75rem; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
    .earn-icon {
      width: 52px; height: 52px; border-radius: var(--r-xl);
      background: var(--accent-sub); border: 1px solid var(--accent-pale);
      display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;
    }
    .earn-icon svg { width: 24px; height: 24px; }

    /* No wallet banner */
    .no-wallet {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--warm-sub); border: 1px solid rgba(200,120,68,.28);
      border-radius: var(--r-lg); padding: 12px 14px; margin-bottom: 18px;
      font-size: .8rem; color: var(--warm); font-weight: 600;
    }
    .no-wallet svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
    .no-wallet a { color: var(--warm); text-decoration: underline; }
    .no-wallet.hidden { display: none; }

    /* Cards grid inherits from style.css .cards-grid */
    .listings-list { display: flex; flex-direction: column; gap: 14px; }

    @media(min-width:1024px){
      .listings-list { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
    }
  </style>
</head>

  <!-- Main -->
  <main class="main-content">

      <!-- No wallet -->
      <div class="no-wallet" id="no-wallet-nag">

        <span><a href="profile.html">Connect your wallet</a> to view and manage your listings.</span>
      </div>

      <!-- Earnings summary -->
      <div class="earn-card anim-up">
        <div class="earn-left">
          <h3 id="total-earned">0.0000 ETH</h3>
          <p>Total earned</p>
        </div>
        <div class="earn-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <div class="chip-scroll" id="status-chips">
          <button class="chip active" data-status="all">All</button>

<script src="app.js"></script>
<script>
  let allListings = [];
  let activeStatus = 'all';

  if (Wallet.isConnected()) document.getElementById('no-wallet-nag').classList.add('hidden');

  async function loadListings() {
    const listEl = document.getElementById('listings-list');
    listEl.innerHTML = '';
    skeletonCards(3).forEach(s => listEl.appendChild(s));

    try {
      const walletAddr = Wallet.getAddress();
      // Fetch user's listings from backend (filter by seller address)
      const data = await API.get('/getData');
      // In a real app, filter by seller === walletAddr
      // For now show all local sell transactions + fetched data
      const localSells = Transactions.getAll()
        .filter(t => t.type === 'sell')
        .map((t, i) => ({
          _id: 'local_' + i,
          name: t.name, category: t.category, price: t.price,
          description: 'Your published dataset.',
          status: 'active', sales: 0, createdAt: t.timestamp
        }));
      allListings = localSells.length ? localSells : data.map(d => ({ ...d, status: 'active', sales: Math.floor(Math.random() * 12) }));
    } catch {
      // Fallback mock
      allListings = Transactions.getAll()
        .filter(t => t.type === 'sell')
        .map((t, i) => ({
          _id: 'local_' + i,
          name: t.name, category: t.category, price: t.price,
          description: 'Your published dataset.',
          status: 'active', sales: 0, createdAt: t.timestamp
        }));
    }

    // Compute total earned
    const earned = allListings.reduce((sum, d) => sum + (parseFloat(d.price) * (d.sales || 0)), 0);
    document.getElementById('total-earned').textContent = earned.toFixed(4) + ' ETH';

    renderListings();
  }

  function renderListings() {
    const listEl = document.getElementById('listings-list');
    const emptyEl = document.getElementById('empty-listings');
    listEl.innerHTML = '';

    const filtered = activeStatus === 'all'
      ? allListings
      : allListings.filter(d => d.status === activeStatus);

    document.getElementById('listing-count').textContent = `${filtered.length} listing${filtered.length !== 1 ? 's' : ''}`;

    if (!filtered.length) { emptyEl.classList.remove('hidden'); return; }
    emptyEl.classList.add('hidden');

    filtered.forEach(item => {
      const bc = badgeClass(item.category);
      const isActive = item.status !== 'inactive';
      const card = document.createElement('div');
      card.className = 'card card-hover listing-card anim-up';
      card.innerHTML = `
        <div class="status-dot ${isActive ? 'active' : 'inactive'}" title="${isActive ? 'Active' : 'Inactive'}"></div>
        <div class="dc-header" style="padding-right:16px">
          <div>
            <div class="dc-name">${esc(item.name)}</div>
            <span class="badge ${bc}">${esc(item.category)}</span>
          </div>
          <div class="dc-price">
            <span class="dc-price-val">${parseFloat(item.price).toFixed(4)}</span>
            <span class="dc-price-unit">ETH</span>
          </div>
        </div>
        <p class="dc-desc">${esc(item.description || '')}</p>
        <div class="listing-meta-row">
          <div class="listing-meta-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span>${item.sales || 0} sales</span>
          </div>
          <div class="listing-meta-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>${item.createdAt ? fmtDate(item.createdAt) : 'Recently'}</span>
          </div>
          <div class="listing-actions">
            <button class="btn btn-secondary btn-sm toggle-status-btn" data-id="${item._id}" data-status="${item.status}">
              ${isActive ? 'Deactivate' : 'Activate'}
            </button>
            <button class="btn btn-ghost btn-sm delete-btn" data-id="${item._id}" style="color:var(--danger)">Remove</button>
          </div>
        </div>`;

      card.querySelector('.toggle-status-btn').addEventListener('click', function () {
        const idx = allListings.findIndex(d => String(d._id) === this.dataset.id);
        if (idx > -1) {
          allListings[idx].status = allListings[idx].status === 'active' ? 'inactive' : 'active';
          Toast.success(`Listing ${allListings[idx].status === 'active' ? 'activated' : 'deactivated'}.`);
          renderListings();
        }
      });
      card.querySelector('.delete-btn').addEventListener('click', function () {
        if (!confirm('Remove this listing?')) return;
        allListings = allListings.filter(d => String(d._id) !== this.dataset.id);
        Toast.show('Listing removed.');
        renderListings();
      });

      listEl.appendChild(card);
    });
  }

  document.getElementById('status-chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    document.querySelectorAll('#status-chips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeStatus = chip.dataset.status;
    renderListings();
  });

  loadListings();
</script>
</body>
